app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # Control whether to show version update notifications, if false, no update prompts will be shown

crawler:
  request_interval: 1000 # Request interval (milliseconds)
  enable_crawler: true # Enable news crawling feature, if false, program will stop
  use_proxy: false # Enable proxy, false to disable
  default_proxy: "http://127.0.0.1:10086"

# 🔸 daily (Daily Summary Mode)
#   • Push timing: Scheduled push (default: hourly)
#   • Display content: All matched news of the day + new news section
#   • Use case: Daily report summary, comprehensive understanding of daily trending topics
#
# 🔸 current (Current Rankings Mode)
#   • Push timing: Scheduled push (default: hourly)
#   • Display content: Current ranking matched news + new news section
#   • Use case: Real-time trending tracking, understand what's currently hot
#
# 🔸 incremental (Incremental Monitor Mode)
#   • Push timing: Push only when new content appears
#   • Display content: Newly appeared news matching frequency words
#   • Use case: Avoid duplicate information disturbance

# Push mode selection
report:
  mode: "daily" # Options: "daily"|"incremental"|"current"
  rank_threshold: 5 # Ranking highlight threshold

notification:
  enable_notification: true # Enable notification feature, if false, no mobile notifications will be sent
  message_batch_size: 4000 # Message batch size (bytes) (don't modify this setting)
  dingtalk_batch_size: 20000 # DingTalk message batch size (bytes) (don't modify this setting either)
  feishu_batch_size: 29000 # Feishu message batch size (bytes)
  batch_send_interval: 3 # Batch send interval (seconds)
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━" # Feishu message separator line

  # 🕐 Push Time Window Control (Optional Feature)
  # Purpose: Limit the time range for push notifications to avoid disturbance during non-working hours
  # Use cases:
  #   - Only want to receive pushes during business hours (e.g., 09:00-18:00)
  #   - Want to receive summary at a fixed time in the evening (e.g., 20:00-22:00)
  push_window:
    enabled: false  # Enable push time window control, disabled by default
    # Note: GitHub Actions execution time is unstable, recommend at least 2-hour time range
    # For precise scheduled push, recommend Docker deployment on personal server
    time_range:
      start: "20:00"  # Push time window start (Beijing time)
      end: "22:00"    # Push time window end (Beijing time)
    once_per_day: true  # Push only once per day within time window, if false, push every execution within window
    push_record_retention_days: 7  # Push record retention days

  # Please keep webhooks secure and do not make them public
  # If deploying this project on GitHub via fork, DO NOT fill in any webhooks here, instead add them to GitHub Secrets
  # Otherwise, at best you'll receive strange ads on your phone, at worst there are more serious security risks
  webhooks:
    feishu_url: "" # Feishu bot webhook URL
    dingtalk_url: "" # DingTalk bot webhook URL
    wework_url: "" # WeWork (Enterprise WeChat) bot webhook URL
    telegram_bot_token: "" # Telegram Bot Token
    telegram_chat_id: "" # Telegram Chat ID
    email_from: "" # Sender email address
    email_password: "" # Sender email password or authorization code
    email_to: "" # Recipient email address, separate multiple recipients with commas
    email_smtp_server: "" # SMTP server address (optional, auto-detect if left empty)
    email_smtp_port: "" # SMTP port (optional, auto-detect if left empty)
    ntfy_server_url: "https://ntfy.sh" # ntfy server address, default uses public service, can change to self-hosted address
    ntfy_topic: "" # ntfy topic name
    ntfy_token: "" # ntfy access token (optional, for private topics)
    discord_webhook_url: "" # Discord webhook URL

# Used to make news with higher attention appear earlier, i.e., use algorithm to reorganize trending searches from different platforms to form your prioritized trending topics. Total should equal 1.
weight:
  rank_weight: 0.6 # Ranking weight
  frequency_weight: 0.3 # Frequency weight
  hotness_weight: 0.1 # Hotness weight

# 'name' can be any custom name, it's only for display purposes. Even if you change the name after running the project for several days, it won't affect code execution
platforms:
  - id: "toutiao"
    name: "Toutiao (今日头条)"
  - id: "baidu"
    name: "Baidu Hot Search (百度热搜)"
  - id: "wallstreetcn-hot"
    name: "Wallstreetcn (华尔街见闻)"
  - id: "thepaper"
    name: "The Paper (澎湃新闻)"
  - id: "bilibili-hot-search"
    name: "Bilibili Hot Search"
  - id: "cls-hot"
    name: "CLS Hot (财联社热门)"
  - id: "ifeng"
    name: "iFeng (凤凰网)"
  - id: "tieba"
    name: "Tieba (贴吧)"
  - id: "weibo"
    name: "Weibo (微博)"
  - id: "douyin"
    name: "Douyin (抖音)"
  - id: "zhihu"
    name: "Zhihu (知乎)"
